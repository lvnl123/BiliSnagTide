name: Windows Release - Portable ZIP and Installer

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-release.yml"
      - "packaging/**"

permissions:
  contents: write

concurrency:
  group: windows-release-v4.6.1
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK on runner
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore Windows x64 dependencies
        shell: pwsh
        run: |
          dotnet restore "Source/BiliSnagTide.csproj" --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw "Restore failed" }

      - name: Publish portable folder without installer
        shell: pwsh
        run: |
          dotnet publish "Source/BiliSnagTide.csproj" --configuration Release --runtime win-x64 --self-contained true -p:PortableBuild=false -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --no-restore --output "out/portable-publish"
          if ($LASTEXITCODE -ne 0) { throw "Portable publish failed" }
          $src = "out/portable-publish/BiliSnagTide.exe"
          if (!(Test-Path $src)) { throw "Missing portable EXE" }
          if (!(Get-ChildItem "out/portable-publish" -Filter "*.dll" | Select-Object -First 1)) { throw "Portable dependencies missing" }
          # Portable mode is activated by this bundled marker; installation build has none.
          Set-Content -Path "out/portable-publish/portable.flag" -Value "portable data mode" -NoNewline -Encoding ascii
          New-Item -ItemType Directory -Force -Path "out/assets" | Out-Null
          $archive = "out/assets/BiliSnagTide-v4.6.1-Windows-x64-Portable.zip"
          Compress-Archive -Path "out/portable-publish/*" -DestinationPath $archive -CompressionLevel Optimal
          if (!(Test-Path $archive)) { throw "Portable ZIP missing" }
          Expand-Archive -Path $archive -DestinationPath "out/portable-check"
          if (!(Test-Path "out/portable-check/BiliSnagTide.exe") -or !(Test-Path "out/portable-check/portable.flag")) {
            throw "Portable ZIP structure check failed"
          }
          if (!(Get-ChildItem "out/portable-check" -Filter "*.dll" | Select-Object -First 1)) { throw "Portable ZIP dependencies missing" }

      - name: Clean between build variants
        shell: pwsh
        run: |
          dotnet clean "Source/BiliSnagTide.csproj" --configuration Release --runtime win-x64 -p:PortableBuild=false
          if ($LASTEXITCODE -ne 0) { throw "Clean failed" }

      - name: Publish installed application without portable flag
        shell: pwsh
        run: |
          dotnet publish "Source/BiliSnagTide.csproj" --configuration Release --runtime win-x64 --self-contained true -p:PortableBuild=false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output "out/publish"
          if ($LASTEXITCODE -ne 0) { throw "Installer payload publish failed" }
          if (!(Test-Path "out/publish/BiliSnagTide.exe")) { throw "Missing installer EXE" }

      - name: Prepare Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found" }

      - name: Build Windows installer EXE
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\BiliSnagTide.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          $installer = "out/installer/BiliSnagTide-v4.6.1-Windows-x64-Setup.exe"
          if (!(Test-Path $installer)) { throw "Installer EXE missing" }
          Copy-Item $installer "out/assets/"

      - name: Verify portable ZIP and installer EXE
        shell: pwsh
        run: |
          $items = @(
            "out/assets/BiliSnagTide-v4.6.1-Windows-x64-Portable.zip",
            "out/assets/BiliSnagTide-v4.6.1-Windows-x64-Setup.exe"
          )
          foreach ($f in $items) {
            if (!(Test-Path $f)) { throw "Missing asset: $f" }
            if ((Get-Item $f).Length -lt 1000000) { throw "Suspiciously small: $f" }
            Get-FileHash $f -Algorithm SHA256 | Format-List
          }

      - name: Write SHA-256 checksum manifest
        shell: pwsh
        run: |
          $files = @(
            "out/assets/BiliSnagTide-v4.6.1-Windows-x64-Portable.zip",
            "out/assets/BiliSnagTide-v4.6.1-Windows-x64-Setup.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = [System.IO.Path]::GetFileName($file)
            "$hash  $name"
          }
          [System.IO.File]::WriteAllLines("out/assets/SHA256SUMS.txt", [string[]]$lines, [System.Text.Encoding]::ASCII)
          if ((Get-Content "out/assets/SHA256SUMS.txt").Count -ne 2) { throw "Checksum manifest incomplete" }

      - name: Publish GitHub Release with portable ZIP and installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v4.6.1"
          $assets = @(
            "out/assets/BiliSnagTide-v4.6.1-Windows-x64-Portable.zip",
            "out/assets/BiliSnagTide-v4.6.1-Windows-x64-Setup.exe",
            "out/assets/SHA256SUMS.txt"
          )
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $assets --title "BiliSnagTide v4.6.1" --notes-file "packaging/RELEASE_NOTES.md" --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publish failed" }
